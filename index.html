<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Controls</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="lib/d3.v7.min.js"></script>
</head>
<body>
    <div id="header-container">
        <div class="controls-left">
            <button id="reset" class="btn btn-primary">
                <i class="fas fa-sync-alt"></i> Reset Graph
            </button>
            <select id="datasetDropdown">
                <!-- Options will be populated by JavaScript -->
            </select>
        </div>
        
        <h1>Dynamic Cyber Security Domain Map</h1>
        
        <div class="controls-right">
            <button id="fit-button" class="btn btn-secondary">
                <i class="fas fa-expand-arrows-alt"></i> Fit Screen
            </button>
        </div>
    </div>
    
    <div class="graph-container">
        <svg id="graph"></svg>
    </div>
    
    <script src="map.js"></script>
</body>
</html>
